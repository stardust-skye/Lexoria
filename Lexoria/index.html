    <script>
        // Add more or keep changing this set of 10 quotes. File is saved in downloads
        const quotes = [
            "No man ever prayed heartily without learning something - Ralph Waldo Emerson",
            "The highest activity a human being can attain is learning for understanding, because to understand is to be free - Baruch Spinoza",
            "The main part of intellectual education is not the acquisition of facts, but learning how to make facts live - Oliver Wendell Holmes, Jr",
            "The past is a place of reference, not a place of residence; the past is a place of learning, not a place of living - Roy T. Bennett",
            "If you think education is expensive, try estimating the cost of ignorance - Howard Gardner",
            "It is not that I'm so smart. But I stay with the questions much longer - Albert Einstein",
            "Learning is a treasure that will follow its owner everywhere - Chinese Proverb",
            "A man who asks is a fool for five minutes. A man who never asks is a fool for life - Chinese Proverb",
            "I don't think much of a man who is not wiser today than he was yesterday - Abraham Lincoln",
            "Never let formal education get in the way of your learning - Mark Twain"
        ];

        // Function to display a random quote based on the number of quotes given above... Dont make changes here okie
        function displayRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            document.getElementById("random-quote").innerText = quotes[randomIndex];
        }

        displayRandomQuote();
    </script>
